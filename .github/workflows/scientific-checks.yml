name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install numerical witness dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p040-scientific"
          timeout --signal=TERM --kill-after=10s 180s \
            python -B -m pip install -r requirements.txt \
            2>&1 | tee "$RUNNER_TEMP/p040-scientific/dependencies.log"
          python -B -m pip freeze > "$RUNNER_TEMP/p040-scientific/installed-packages.txt"
      - name: Whole bounded finite reproduction and exact gates
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s bash -euo pipefail -c '
            ulimit -v 3145728
            ulimit -t 300
            python -B -S .github/scripts/check_repository.py
            for phase in models oracles allocation verify; do
              python -B reproduce.py "$RUNNER_TEMP/p040-scientific/fresh" "$phase"
            done
          ' 2>&1 | tee "$RUNNER_TEMP/p040-scientific/run.log"
      - name: Retain raw outputs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p040-scientific-raw
          path: ${{ runner.temp }}/p040-scientific/
          if-no-files-found: warn
